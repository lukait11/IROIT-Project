spring.config.import=optional:classpath:.env
spring.application.name=order-service
# App Settings
server.port=${SERVER_PORT:8082}

# Database Settings
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/order-service}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# PostgreSQL Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka Settings
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Fail fast instead of blocking each request for the client default of 60s when the broker is unreachable
spring.kafka.producer.properties.max.block.ms=5000

# Healthcheck endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
