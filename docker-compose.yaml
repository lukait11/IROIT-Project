name: iroit-project

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - iroit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-broker cluster: internal topics can't use the replication
      # factor of 3 the image defaults to, or consumer groups hang forever
      # waiting on __consumer_offsets to be created.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - iroit
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - iroit
    restart: unless-stopped

  user-service:
    build:
      context: user-service
      dockerfile: Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    env_file:
      - path: /opt/iroit/user.env
        required: false
      - path: /opt/iroit/services.env
        required: false
    networks:
      - iroit
    depends_on:
      postgres:
        condition: service_healthy
      tempo:
        condition: service_started
    restart: unless-stopped

  order-service:
    build:
      context: order-service
      dockerfile: Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    env_file:
      - path: /opt/iroit/order.env
        required: false
      - path: /opt/iroit/services.env
        required: false
    networks:
      - iroit
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      tempo:
        condition: service_started
    restart: unless-stopped

  payment-service:
    build:
      context: payment-service
      dockerfile: Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    env_file:
      - path: /opt/iroit/payment.env
        required: false
      - path: /opt/iroit/services.env
        required: false
    networks:
      - iroit
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      tempo:
        condition: service_started
    restart: unless-stopped

  notification-service:
    build:
      context: notification-service
      dockerfile: Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    env_file:
      - path: /opt/iroit/notification.env
        required: false
      - path: /opt/iroit/services.env
        required: false
    networks:
      - iroit
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_started
      tempo:
        condition: service_started
    restart: unless-stopped

  api-gateway:
    build:
      context: api-gateway
      dockerfile: Dockerfile
    ports:
      - "8089:8080"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    env_file:
      - path: /opt/iroit/gateway.env
        required: false
    networks:
      - iroit
    depends_on:
      - user-service
      - order-service
      - payment-service
      - notification-service
      - tempo
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - iroit
    restart: unless-stopped

  grafana:
    # Pinned below v13's new dashboard schema/rendering engine, which broke
    # provisioned classic-schema dashboards (panels silently failed to mount).
    image: grafana/grafana:11.3.0
    env_file:
      - path: /opt/iroit/grafana.env
        required: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - iroit
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  tempo_data:

networks:
  iroit:
    driver: bridge
