spring.config.import=optional:classpath:.env
spring.application.name=api-gateway
# App Settings
server.port=${SERVER_PORT:8080}

# Routes - single entry point fanning out to the backend microservices.
# Each route strips its "/api/<service>" prefix before forwarding, since the
# backend services expose their own endpoints at their own root path.
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webmvc.routes[1].id=order-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${ORDER_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webmvc.routes[2].id=payment-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${PAYMENT_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webmvc.routes[3].id=notification-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=2

# Healthcheck endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
